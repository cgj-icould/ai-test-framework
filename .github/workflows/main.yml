name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'   # 如果你项目用的是 JDK 8 或 11，把这里改一下
        distribution: 'temurin'
        cache: maven
        
    - name: Build and Test with Maven
      run: mvn clean test
